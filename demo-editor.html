<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <base target="_top">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- The fonts load without holding up the first paint; the system font stands in until then. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
    <style>
      /* The palette, shared by the sidebar and the editor and inlined by the build where a page has
   the TOKENS marker. Every colour lives here. */
:root {
  --canvas: #eff1f3;
  --surface: #ffffff;
  --text: #14171a;
  --muted: #59606a;
  --faint: #666d77; /* 4.6:1 on the canvas, 5.2:1 on white */
  --line: #e1e4e8;
  --line-strong: #cbd0d6;
  --hover-bg: #f7f8fa;
  --selected-bg: #eceff2;
  --skeleton: #e4e7eb;
  --brand: #14171a;
  --brand-raised: #252a30;
  --brand-line: #363c44;
  --on-brand: #f1f3f5;
  --on-brand-muted: #9aa2ac;
  --accent: #14171a;
  --accent-strong: #000000;
  --on-accent: #ffffff;
  --link: #3a46b0;
  --focus: #3a46b0;
  /* The brand: deep indigo, used sparingly (logo, links, focus, an active control). Send stays ink. */
  --indigo: #3a46b0; /* 7.8:1 on white */
  --indigo-tint: #eceefa;
  --warn: #c98a1b;
  --warn-text: #6b4a0c;
  --error: #b42318;
  --error-bg: #fdf0ee;
  --shadow: rgba(20, 23, 26, 0.06);
  --bar-shadow: rgba(20, 23, 26, 0.10);
  --primary-sheen: rgba(255, 255, 255, 0.08);
  --g1: #2e7d6b; --g2: #b5475f; --g3: #6b5bb5; --g4: #2f6f8f; --g5: #5f7d2e; --g6: #8a7a6c;
  --radius: 10px;
  --sans: "Schibsted Grotesk", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --mono: "DM Mono", ui-monospace, Menlo, Consolas, monospace;
}


      * { box-sizing: border-box; }
      html, body { height: 100%; background: var(--canvas); }
      body { margin: 0; font-family: var(--sans); font-size: 13px; line-height: 1.45; color: var(--text); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; overflow: hidden; }
      [hidden] { display: none !important; }
      .code, .resolved, textarea.text-view { font-family: var(--mono); font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }

      /* Controls, as in the sidebar */
      button { font: inherit; font-weight: 600; border-radius: 8px; cursor: pointer; transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease; }
      button:disabled { cursor: default; opacity: 0.45; }
      :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
      button.primary { min-height: 32px; background: var(--accent); color: var(--on-accent); border: 1px solid transparent; padding: 6px 16px; }
      button.secondary { min-height: 32px; background: var(--surface); color: var(--text); border: 1px solid var(--line-strong); padding: 5px 12px; }
      button.secondary:hover:not(:disabled) { border-color: var(--muted); }
      button.quiet { min-height: 32px; background: none; border: 1px solid transparent; color: var(--muted); padding: 5px 8px; font-weight: 500; }
      button.quiet:hover:not(:disabled) { color: var(--text); background-color: var(--hover-bg); }
      button.quiet[aria-pressed="true"] { color: var(--text); background: var(--selected-bg); }
      input[type="text"], input[type="number"], textarea { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 9px; min-height: 32px; transition: border-color 140ms ease; }
      input[type="text"]:hover, input[type="number"]:hover, textarea:hover { border-color: var(--muted); }
      input.invalid, textarea.invalid { border-color: var(--error); }

      /* Top strip: which report, its state, and Save */
      #topbar { flex: none; display: flex; align-items: center; gap: 10px; padding: 2px 16px 8px 18px; background: var(--surface); color: var(--text); border-bottom: 1px solid var(--line); }
      .title-field { flex: 0 1 auto; min-width: 0; display: flex; align-items: center; gap: 2px; margin: 0; color: var(--muted); cursor: text; }
      .title-field svg { flex: none; width: 14px; height: 14px; transition: color 140ms ease; }
      .title-field:hover svg, .title-field:focus-within svg { color: var(--text); }
      .spacer { flex: 1; }
      #title { field-sizing: content; min-width: 10ch; max-width: 100%; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: var(--text); background: transparent; border-color: transparent; }
      #title:hover { border-color: var(--line-strong); }
      #title:focus { background: var(--hover-bg); border-color: var(--line-strong); outline: none; }
      .bar-link { flex: none; font-size: 12px; color: var(--muted); text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
      .bar-link:hover { color: var(--text); }
      #state { flex: none; font-size: 12px; color: var(--muted); }
      #draft { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
      #draft span { flex: 1; }

      /* Writing on the left, the email as sent on the right; one column when narrow */
      main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
      #write { min-height: 0; display: flex; flex-direction: column; background: var(--surface); }
      #editor { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 24px 32px; }
      #preview-pane { min-height: 0; overflow-y: auto; padding: 12px 20px 20px; border-left: 1px solid var(--line); background: var(--canvas); }
      @media (max-width: 800px) {
        body { overflow: auto; }
        main { display: block; }
        #editor, #preview-pane { overflow: visible; }
        #preview-pane { border-left: 0; border-top: 1px solid var(--line); }
      }

      /* The email's header lines, ruled like a compose window */
      .fields { border-bottom: 1px solid var(--line); margin-bottom: 18px; }
      .field { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; align-items: start; gap: 8px; padding: 6px 0; }
      .picks { padding-top: 7px; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--muted); cursor: default; }
      .field + .field { border-top: 1px solid var(--line); }
      .field > span { padding-top: 6px; font-size: 12px; color: var(--faint); }
      .field label.check { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 13px; color: var(--muted); cursor: pointer; }
      .field .cm-content { padding: 5px 0; font-size: 14px; }
      .field .error { grid-column: 2; }

      /* The writing surface */
      .cm-editor { font-family: var(--sans); color: var(--text); }
      .cm-editor.cm-focused { outline: none; }
      .cm-scroller { font-family: inherit; line-height: 1.65; }
      .body-editor .cm-content { min-height: 240px; padding: 0; font-size: 15px; caret-color: var(--text); }
      .subject-editor .cm-content { padding: 5px 0; font-size: 15px; font-weight: 600; }
      .cm-line { padding: 0; }
      .cm-placeholder { color: var(--faint); font-weight: 400; }
      .md-b { font-weight: 650; }
      .md-i { font-style: italic; }
      .md-li { padding-left: 18px !important; text-indent: -12px; }
      .md-bullet { display: inline-block; width: 12px; color: var(--muted); }

      /* Chips: what a token means, in the sentence */
      .tok { display: inline-flex; align-items: baseline; gap: 5px; margin: 0 1px; padding: 0 6px; border-radius: 6px; background: var(--selected-bg); color: var(--text); font-size: 0.92em; font-weight: 600; line-height: 1.6; cursor: pointer; box-shadow: inset 0 0 0 1px transparent; transition: box-shadow 140ms ease; }
      .tok:hover { box-shadow: inset 0 0 0 1px var(--line-strong); }
      .tok { position: relative; }
      .tok[data-tip]:hover::after { content: attr(data-tip); position: absolute; z-index: 5; left: 0; bottom: calc(100% + 6px); width: max-content; max-width: 260px; padding: 5px 8px; font-size: 12px; font-weight: 400; line-height: 1.4; white-space: normal; color: var(--surface); background: var(--text); border-radius: 6px; pointer-events: none; }
      .tok-problem { background: var(--error-bg); color: var(--error); }
      .tok-problem::before { content: "Problem"; font-weight: 600; }

      /* A table in the message */
      .table-card { display: flex; flex-direction: column; gap: 2px; margin: 8px 0; padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--canvas); cursor: pointer; transition: border-color 140ms ease; }
      .table-card:hover { border-color: var(--muted); }
      .table-card.active { border-color: var(--text); box-shadow: 0 0 0 1px var(--text); }
      .table-card strong { font-size: 13px; }
      .table-card span { font-size: 12.5px; color: var(--muted); }
      .table-card.problem { border-color: var(--error); }
      .table-card.problem span { color: var(--error); }

      /* The @ menu */
      .cm-tooltip.cm-tooltip-autocomplete { border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); box-shadow: 0 10px 30px var(--bar-shadow); padding: 4px; }
      .cm-tooltip-autocomplete > ul { font-family: var(--sans) !important; max-height: 300px !important; min-width: 260px; }
      .cm-tooltip-autocomplete > ul > li { display: flex; gap: 12px; padding: 6px 10px !important; border-radius: 6px; font-size: 13px; color: var(--text); }
      .cm-tooltip-autocomplete > ul > li[aria-selected] { background: var(--selected-bg) !important; color: var(--text) !important; }
      .cm-completionLabel { flex: 1; }
      .cm-completionDetail { margin-left: auto; color: var(--faint); font-style: normal !important; }
      .cm-completionMatchedText { text-decoration: none !important; font-weight: 600; }
      .cm-completionSection, .cm-tooltip-autocomplete completion-section { display: block; padding: 8px 10px 3px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--faint); border: 0 !important; }

      /* Table settings, docked under the message so the preview stays in view */
      #table-panel { flex: none; max-height: 58%; overflow-y: auto; border-top: 1px solid var(--line-strong); background: var(--surface); box-shadow: 0 -8px 24px var(--shadow); }
      .panel-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 6px; padding: 10px 16px 10px 28px; background: var(--surface); border-bottom: 1px solid var(--line); }
      .panel-head strong { font-size: 13px; }
      .panel-source { flex: 1; min-width: 0; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .panel-body { padding: 4px 28px 18px; }
      .row { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 8px; align-items: start; margin-top: 14px; }
      .row > span { padding-top: 6px; font-size: 12px; color: var(--faint); }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .chip { min-height: 28px; max-width: 100%; padding: 3px 11px; font-size: 12.5px; font-weight: 500; color: var(--text); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 999px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .chip:hover { border-color: var(--muted); }
      .chip[aria-pressed="true"], .chip[aria-checked="true"] { background: var(--text); border-color: var(--text); color: var(--surface); }
      .filters { display: grid; gap: 6px; }
      .filter { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      .filter input { flex: 1; min-width: 90px; }
      .add-filter { margin-left: -8px; }
      .picker { display: inline-flex; align-items: center; gap: 4px; min-height: 32px; padding: 5px 10px; font-weight: 500; background: var(--surface); color: var(--text); border: 1px solid var(--line-strong); }
      .picker:hover { border-color: var(--muted); }
      .picker::after { content: ""; width: 6px; height: 6px; margin-left: 2px; border-right: 1.5px solid var(--faint); border-bottom: 1.5px solid var(--faint); transform: translateY(-2px) rotate(45deg); }
      .inline { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      .inline input[type="number"] { width: 72px; }
      .inline-hint { margin: 0 !important; }
      textarea.text-view { display: block; width: 100%; margin-top: 12px; resize: vertical; font-size: 12px; line-height: 1.55; }

      /* Date picker, in the panel and in a chip's popover */
      .date-picker .chips { margin-top: 8px; }
      .written { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
      .written span { flex: none; font-size: 12px; color: var(--faint); }
      .written input { flex: 1; min-width: 0; font-size: 12.5px; }
      .resolved { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
      .date-picker + .picker { margin-top: 8px; }

      /* Messages: an error says what and where; colour is never the only sign */
      .error { margin: 6px 0 0; color: var(--error); font-size: 12px; }
      #editor > details { margin-top: 8px; font-size: 12px; color: var(--muted); }
      #editor > details pre { white-space: pre-wrap; word-break: break-word; font-size: 11px; }
      .error::before { content: "Problem: "; font-weight: 600; }
      .resolved.error { font-family: var(--sans); }
      .hint { margin: 4px 0 0; font-size: 12px; color: var(--faint); }

      /* Menus and popovers */
      .menu { position: fixed; z-index: 10; min-width: 200px; max-width: 360px; max-height: 340px; overflow-y: auto; padding: 4px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: 0 10px 30px var(--bar-shadow); }
      .menu > button { display: flex; justify-content: space-between; gap: 16px; width: 100%; min-height: 30px; padding: 5px 10px; text-align: left; font-weight: 500; color: var(--text); background: none; border: 0; border-radius: 6px; }
      .menu > button:hover, .menu > button:focus-visible { background: var(--hover-bg); outline: none; }
      .menu > button.checked { background: var(--selected-bg); }
      .menu .sample { color: var(--faint); font-weight: 400; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .menu .group { padding: 8px 10px 4px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--faint); }
      .popover { width: 340px; padding: 4px 8px 6px; }
      .popover .date-picker .chips { margin-top: 4px; }
      .popover .remove { margin: 8px 0 0 -8px; }

      /* Preview: the email as it will be sent */
      .preview-head { display: flex; align-items: center; gap: 4px; min-height: 32px; }
      .preview-head h2 { margin: 0; font-size: 10.5px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--faint); }
      #preview-status { flex: 1; padding-left: 8px; font-size: 12px; color: var(--faint); }
      .read-at { display: flex; align-items: center; gap: 2px; }
      .email-head { display: flex; align-items: center; gap: 8px; margin: -6px -8px 4px 0; }
      .email-head #preview-label { flex: 1; margin: 0; }
      .preview-nav { flex: none; display: flex; align-items: center; gap: 0; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
      .preview-nav button { min-height: 28px; padding: 2px 8px; font-size: 15px; }
      #preview-email { margin-top: 10px; padding: 16px 20px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 1px 2px var(--shadow); }
      #preview-label { margin: 0 0 4px; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
      #preview-subject { margin: 0 0 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line); font-size: 16px; font-weight: 600; letter-spacing: -0.01em; overflow-wrap: anywhere; }
      #preview-frame { display: block; width: 100%; border: 0; }
      /* Why these rows: under the email, quiet until opened */
      #preview-rows { margin-top: 10px; }
      .rows-table { padding: 8px 2px; border-bottom: 1px solid var(--line); }
      .rows-table > p { margin: 0; font-weight: 600; }
      .rows-table details { margin-top: 4px; color: var(--muted); }
      .rows-table summary { cursor: pointer; }
      .rows-table ul { margin: 6px 0 2px; padding-left: 18px; }
      .rows-table li { margin-top: 4px; }
      .rows-table .examples { color: var(--faint); }
      #preview-hint { margin: 14px 0 0; color: var(--muted); }
      #as-of-note { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 10px 0 0; padding: 6px 6px 6px 12px; border-radius: var(--radius); background: var(--selected-bg); font-weight: 600; }
      #preview-blocked { margin-top: 10px; padding: 10px 12px; border-radius: var(--radius); background: var(--error-bg); color: var(--error); }
      #preview-blocked::before { content: "Not sendable: "; font-weight: 600; }
      #preview-skipped { margin: 8px 0 0; font-size: 12px; color: var(--muted); }
      #preview-checks { margin-top: 10px; padding: 8px 12px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); }
      #preview-checks summary { cursor: pointer; font-weight: 600; color: var(--warn-text); }
      #preview-checks ul { margin: 8px 0 2px; padding-left: 18px; color: var(--text); }
      #preview-checks li + li { margin-top: 6px; }
      #preview-error { margin-top: 10px; padding: 12px 14px; border-radius: var(--radius); background: var(--error-bg); color: var(--error); white-space: pre-wrap; }

      #toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); max-width: min(640px, calc(100vw - 32px)); display: flex; align-items: baseline; gap: 12px; padding: 9px 14px; color: var(--on-brand); background: var(--brand); border-radius: 8px; box-shadow: 0 8px 24px var(--bar-shadow); }
      #toast.error { background: var(--error); }
      #toast a { flex: none; color: inherit; font-weight: 600; }
      #toast .dismiss { flex: none; color: inherit; background: none; border: 0; padding: 0; font: inherit; font-weight: 600; text-decoration: underline; cursor: pointer; }
      /* Shown until the editor is drawn: the shape of what is coming, not a blank page */
      .skeleton { padding: 14px 0; }
      .skeleton div { height: 12px; margin: 14px 0; border-radius: 6px; background: var(--skeleton); }
      .skeleton .w40 { width: 40%; } .skeleton .w60 { width: 60%; } .skeleton .w70 { width: 70%; } .skeleton .w80 { width: 80%; } .skeleton .w90 { width: 90%; }
      .skeleton .gap { height: 6px; background: none; }
      .skeleton .block { height: 64px; border-radius: var(--radius); }
      #preview-pane.updating #preview-email, #preview-pane.updating #preview-rows { opacity: 0.55; transition: opacity 140ms ease; }
      .read-at { font-size: 12px; color: var(--faint); }

      /* The editor arrives drawn; a short fade makes the hand-off from the sidebar feel continuous */
      main { animation: arrive 160ms ease-out; }
      @keyframes arrive { from { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
    </style>
  </head>
  <body>
    <header id="topbar">
      <label class="title-field" title="The report's name, which is also its tab's name in the Doc">
        <input id="title" type="text" aria-label="Report name" placeholder="Name this report" spellcheck="false">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 2.5l3 3-8 8h-3v-3z"/><path d="M9 4l3 3"/></svg>
      </label>
      <span id="state" role="status"></span>
      <span class="spacer"></span>
      <a id="open-doc" class="bar-link" href="#" target="_blank" rel="noopener" hidden>Open in Doc</a>
      <a id="guide" class="bar-link" href="https://slicemail.enayatullah.com/support.html#writing-a-template" target="_blank" rel="noopener">Template guide</a>
      <button id="save" class="primary" type="button" disabled>Save to Doc</button>
    </header>
    <div id="draft" role="status" hidden>
      <span id="draft-text"></span>
      <button id="draft-restore" class="secondary" type="button">Restore</button>
      <button id="draft-discard" class="quiet" type="button">Discard</button>
    </div>
    <main>
      <section id="write" aria-label="Template">
        <div id="editor">
          <div class="skeleton" aria-label="Opening the report"><div class="w60"></div><div class="w40"></div><div class="w70"></div><div class="gap"></div><div class="w90"></div><div class="w80"></div><div class="block"></div></div>
        </div>
        <div id="table-panel" aria-label="Table settings" hidden></div>
      </section>
      <section id="preview-pane" aria-label="Preview">
        <div class="preview-head">
          <h2>Preview</h2>
          <span id="preview-status" role="status"></span>
          <span class="read-at"><span id="read-at"></span><button id="refresh-data" class="quiet" type="button" title="Read the sheet again">Refresh</button></span>
          <button id="as-of" class="quiet" type="button" aria-label="Preview as of a day">As of today</button>
        </div>
        <p id="as-of-note" hidden><span id="as-of-text"></span> <button id="as-of-reset" class="quiet" type="button">Back to today</button></p>
        <div id="preview-blocked" role="alert" hidden></div>
        <p id="preview-skipped" hidden></p>
        <details id="preview-checks" hidden>
          <summary id="preview-checks-count"></summary>
          <ul id="preview-checks-list"></ul>
        </details>
        <div id="preview-email" hidden>
          <div class="email-head">
            <p id="preview-label"></p>
            <span class="preview-nav" hidden>
              <button id="prev-email" class="quiet" type="button" aria-label="Previous email">‹</button>
              <span id="email-count"></span>
              <button id="next-email" class="quiet" type="button" aria-label="Next email">›</button>
            </span>
          </div>
          <p id="preview-subject"></p>
          <iframe id="preview-frame" title="Email body" sandbox="allow-same-origin"></iframe>
        </div>
        <div id="preview-rows"></div>
        <p id="preview-hint" hidden></p>
        <div id="preview-error" hidden></div>
      </section>
    </main>
    <div id="toast" role="status" hidden></div>
    <script>"use strict";
(() => {
