<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>The film · Slicemail</title><link rel="icon" href="assets/icon-32.png" sizes="32x32"><link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#fff;--text:#14171a;--muted:#5b626b;--line:#e3e6ea;--accent:#3a46b0;--code:#f3f5f7}
@media (prefers-color-scheme:dark){:root{--bg:#14171a;--text:#e8eaed;--muted:#9aa1a9;--line:#2c3238;--accent:#8f9bff;--code:#1f2429}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 "Schibsted Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
html{scrollbar-gutter:stable}header,main,footer{max-width:1120px;margin:0 auto;padding:0 20px}
.narrow{max-width:1040px}
header{display:flex;align-items:center;gap:12px;padding-top:24px;padding-bottom:12px}
header img{width:36px;height:36px;border-radius:9px}header a{color:var(--text);text-decoration:none;font-weight:600}
nav{margin-left:auto;display:flex;gap:16px;font-size:14px}nav a{color:var(--muted);font-weight:400}
h1{font-size:2rem;line-height:1.2;margin:1.2em 0 .4em}h2{font-size:1.25rem;margin:1.8em 0 .4em}h3{font-size:1.05rem;margin:1.4em 0 .3em}
a{color:var(--accent)}p,li{max-width:70ch}code{background:var(--code);padding:.1em .35em;border-radius:5px;font-size:.92em}
pre{background:var(--code);padding:12px 14px;border-radius:8px;overflow:auto}pre code{background:none;padding:0}
table{border-collapse:collapse;width:100%;margin:1em 0;font-size:.94rem}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
blockquote{margin:1em 0;padding:.2em 1em;border-left:3px solid var(--line);color:var(--muted)}
header{flex-wrap:wrap}@media (max-width:560px){nav{margin-left:0;width:100%;gap:18px}header{gap:8px}}
footer{padding-top:32px;padding-bottom:40px;color:var(--muted);font-size:14px}
.lede{font-size:1.15rem;color:var(--muted)}.demo{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:24px 0}.demo iframe{display:block;width:100%;height:720px;border:0}
.shots{display:grid;gap:16px;margin:24px 0}.shots img{max-width:100%;border:1px solid var(--line);border-radius:10px}
</style></head><body>
<header><img src="assets/icon-96.png" alt=""><a href="index.html">Slicemail</a>
<nav><a href="demo.html">Demo</a><a href="support.html">Support</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></nav></header>
